<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Full Count</title>
<meta name="description" content="A Pokémon-style baseball game with real 2026 MLB players. Every plate appearance is a battle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Graduate&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column under stadium lights (Pick & Roll's look). Menus use a broadcast style; the game
   screen is a handheld battle view: scorebug, pixel ballpark with status boxes, then a paper text frame that holds
   the play-by-play and the command menus. */
:root{
  color-scheme: dark;
  --night:#0b1322; --deck:#131d31; --deck-2:#1a2742; --deck-3:#243659; --line:#2c3c5f;
  --chalk:#eef2f8; --white:#ffffff; --mist:#9cabc5; --dim:#6c7b99;
  --flag:#ffd23f; --flag-ink:#2a2200;
  --grass:#3f8f3a; --grass-2:#357d31; --dirt:#b9824f; --leather:#f2efe6; --stitch:#c8312c;
  --paper:#f7f7f1; --paper-2:#e6e3d6; --ink:#1b2131; --ink-hot:#b42b1f; --ink-cold:#2357b5; --ink-sys:#5d6a85; --ink-good:#1d7a43;
  --hp-g:#3fcb6a; --hp-y:#f1c12c; --hp-r:#e5483a; --hp-bg:#3a4256; --exp:#3f9cf5; --ftg:#4fb6e8;
  --frame:#b42b1f; --good:#5fd38a; --bad:#ff7466;
  --glow:rgba(255,236,190,.085); --scrim-bg:rgba(5,9,18,.66);
  --f-display:'Graduate','Rockwell','Courier New',serif;
  --f-ui:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-pixel:'Pixelify Sans',ui-monospace,'Courier New',monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--night);background-image:radial-gradient(70% 34% at 10% -6%,var(--glow),transparent 70%),radial-gradient(70% 34% at 90% -6%,var(--glow),transparent 70%);background-repeat:no-repeat;color:var(--chalk);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.frame :focus-visible,.sbox :focus-visible{outline-color:var(--ink-cold)}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:600 12px/1.1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.muted{color:var(--mist);font-size:14px}
.h2{font:400 26px/1.05 var(--f-display);text-wrap:balance}
.card{background:var(--deck);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;min-width:0}
.card h3{font:700 17px/1.1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 16px;font:700 17px/1 var(--f-ui);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;background:var(--deck-3);color:var(--chalk);text-align:center}
.btn.primary{background:var(--flag);color:var(--flag-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mist)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:8px 11px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.chip-btn{border:1px solid var(--line);background:var(--deck);border-radius:7px;padding:7px 10px;font:700 13px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mist);cursor:pointer;white-space:nowrap}
.chip-btn[aria-pressed="true"]{color:var(--chalk)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.ty{display:inline-flex;align-items:center;padding:2px 6px;border-radius:4px;background:var(--ty);color:var(--tyfg,#111);font:700 11px/1.25 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ty);flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.eff{display:inline-block;font:800 12px/1 var(--f-ui);padding:3px 5px;border-radius:4px;white-space:nowrap;letter-spacing:.04em;text-transform:uppercase}
.eff.up{background:var(--good);color:var(--night)} .eff.dn{background:var(--bad);color:var(--night)} .eff.z{background:#6c7b99;color:var(--night)}
.eff.n{color:var(--dim);border:1px solid var(--line)}
.frame .eff.n{color:var(--ink-sys);border-color:rgba(27,33,49,.35)}
.tag{display:inline-block;padding:3px 7px;border-radius:5px;background:var(--deck-2);border:1px solid var(--line);color:var(--chalk);font:600 13px/1.1 var(--f-ui);letter-spacing:.02em}
.tag.up{border-color:var(--good);color:var(--good)} .tag.dn{border-color:var(--bad);color:var(--bad)}
.tm-chip{display:inline-flex;align-items:center;gap:4px;font:700 11px/1.25 var(--f-ui);letter-spacing:.06em;color:var(--mist);white-space:nowrap}
.tm-chip i{width:8px;height:8px;border-radius:2px;background:var(--tc);box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.pos-chip{font:800 11px/1 var(--f-ui);letter-spacing:.08em;color:var(--flag)}
.attr{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;background:var(--deck-3);color:var(--chalk);font:700 11px/1.25 var(--f-ui);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.attr b{font-weight:800;color:var(--flag)} .attr.hi b{color:var(--good)}
.lv{font:600 12px/1 var(--f-pixel);color:var(--mist);white-space:nowrap}

/* ---------- Title ---------- */
.hero{position:relative;border-radius:14px;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#123a24 0%,var(--grass) 55%,var(--grass-2) 100%);padding:30px 18px 22px;border:2px solid #24582a}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 26px,transparent 26px 52px)}
.hero .dia{position:absolute;right:-12%;bottom:-34%;width:62%;aspect-ratio:1;transform:rotate(45deg);background:var(--dirt);border:4px solid rgba(255,255,255,.85);z-index:0;opacity:.9}
.hero .dia::after{content:"";position:absolute;inset:26%;background:var(--grass);border:3px solid rgba(255,255,255,.6)}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 8px;align-items:end}
.hero-copy{display:grid;gap:12px;min-width:0}
.hero-spr{width:clamp(78px,24vw,120px);height:auto;image-rendering:pixelated;filter:drop-shadow(0 5px 0 rgba(0,0,0,.28))}
.wordmark{font:400 clamp(48px,15vw,84px)/.9 var(--f-display);color:var(--white);text-shadow:0 4px 0 rgba(0,0,0,.35);letter-spacing:.01em}
.hero-tag{font:500 16px/1.4 var(--f-body);color:var(--white);max-width:34ch;text-shadow:0 1px 2px rgba(0,0,0,.4);grid-column:1/-1}
.on-turf{color:var(--white);opacity:.9}
.setup label,.setup .lbl{display:block;font:600 12px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mist);margin-bottom:6px}
.field-in,.sel-in{width:100%;background:var(--night);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:500 16px var(--f-body)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--night);padding:4px;border-radius:9px;border:1px solid var(--line)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;text-align:center;padding:9px 4px;border-radius:6px;cursor:pointer;font:700 14px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
.seg input:checked+label{background:var(--deck-3);color:var(--chalk)}
.seg input:focus-visible+label{outline:2px solid var(--flag)}
.mode-pick{display:grid;grid-template-columns:1fr;gap:8px}
.mode-pick input{position:absolute;opacity:0;pointer-events:none}
.mode-pick label{display:grid;gap:3px;margin:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--night);cursor:pointer;text-transform:none;letter-spacing:0}
.mode-pick label b{font:700 15px/1.1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--chalk)}
.mode-pick label span{font:400 13px/1.3 var(--f-body);color:var(--mist)}
.mode-pick input:checked+label{border-color:var(--flag);box-shadow:inset 0 0 0 1px var(--flag)}
.mode-pick input:focus-visible+label{outline:2px solid var(--flag)}
.how{display:grid;gap:10px}
.how div{display:grid;gap:3px;padding:12px 14px;border-left:3px solid var(--line)}
.how b{font:700 16px/1.1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
.how p{color:var(--mist);font-size:14px}
.resume{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- Team pick, hubs ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.team-head{display:grid;gap:8px}
.team-name{font:400 clamp(28px,8vw,40px)/1 var(--f-display);text-wrap:balance}
.stats-line{display:flex;gap:16px;flex-wrap:wrap}
.stat b{display:block;font:800 26px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.stat span{font:600 11px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}
.rat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rat div{background:var(--deck-2);border-radius:8px;padding:8px;display:grid;gap:2px;text-align:center}
.rat b{font:800 22px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.rat span{font:600 10px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}
.opp-name{font:400 clamp(26px,7.5vw,34px)/1.05 var(--f-display);text-wrap:balance}
.sched ol{list-style:none;padding:0;margin:0}
.sched li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.sched li:last-child{border-bottom:0}
.wk{font:700 13px/1 var(--f-ui);letter-spacing:.06em;color:var(--mist);text-transform:uppercase}
.res{font:800 15px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.res.w{color:var(--good)} .res.l{color:var(--bad)}
.sched li.next{background:linear-gradient(90deg,var(--deck-2),transparent)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;list-style:none;padding:0;margin:0}
.badge{display:grid;justify-items:center;gap:5px;font:600 10px/1.1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:center}
.badge i{width:34px;height:22px;clip-path:polygon(0 0,100% 50%,0 100%);background:var(--line)}
.badge.got{color:var(--chalk)}
.badge.got i{background:var(--bc)}
.badge.next i{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px)}
.party{display:grid;gap:8px}
.pc{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--deck-2);border:1px solid var(--line)}
.pc-spr{width:40px;height:48px;image-rendering:pixelated;justify-self:center}
.pc-main{display:grid;gap:4px;min-width:0}
.pc-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.pc-pos{font:800 12px/1 var(--f-ui);letter-spacing:.08em;color:var(--flag);min-width:22px}
.pc-name{font:600 15px/1.1 var(--f-pixel);flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-lv{font:600 13px/1 var(--f-pixel);color:var(--mist);white-space:nowrap}
.pc-sub{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pc-stat{font:500 12px/1.2 var(--f-body);color:var(--mist)}
.pc-flag{font:700 10px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;border-radius:4px;background:var(--deck-3);color:var(--mist)}
.pc-flag.bad{background:var(--bad);color:var(--night)}
.expbar{display:block;height:5px;background:var(--hp-bg);border-radius:3px;overflow:hidden}
.expbar i{display:block;height:100%;background:var(--exp)}
.lu{display:grid;gap:6px}
.lu-row{appearance:none;display:grid;grid-template-columns:22px 34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--deck-2);color:var(--chalk);text-align:left;cursor:pointer;width:100%}
.lu-row .no{font:800 14px/1 var(--f-ui);color:var(--mist);text-align:center}
.lu-row .po{font:800 13px/1 var(--f-ui);letter-spacing:.06em;color:var(--flag);text-align:center;padding:5px 0;border-radius:6px;border:1px solid var(--line)}
.lu-row .nm{display:grid;gap:3px;min-width:0}
.lu-row .nm b{font:600 15px/1.1 var(--f-pixel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lu-row .val{font:700 13px/1.1 var(--f-ui);color:var(--mist);text-align:right;white-space:nowrap}
.lu-row[aria-pressed="true"]{border-color:var(--flag);box-shadow:inset 0 0 0 1px var(--flag)}
.lu-row.bench{border-style:dashed;background:transparent}
.lu-row .po[aria-pressed="true"]{background:var(--flag);color:var(--flag-ink)}
.lu-head{font:700 11px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mist);margin-top:6px}
.hint{font-size:14px;line-height:1.5;color:var(--mist)}

/* ---------- Battle ---------- */
.g-wrap{display:flex;flex-direction:column;gap:12px}
.g-top{display:flex;align-items:center;gap:8px}
.g-title{flex:1 1 auto;min-width:0;font:600 13px/1.1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#bug{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bug{display:grid;grid-template-columns:minmax(0,1fr) auto;background:var(--deck);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.bug.flash{animation:bugflash 1.2s ease-out 1}
@keyframes bugflash{0%,30%{box-shadow:0 0 0 3px var(--flag),0 8px 20px rgba(0,0,0,.4)}100%{box-shadow:0 8px 20px rgba(0,0,0,.4)}}
.ls{width:100%;border-collapse:collapse;font:700 13px/1 var(--f-ui);font-variant-numeric:tabular-nums;table-layout:fixed}
.ls th,.ls td{padding:5px 2px;text-align:center;border-right:1px solid rgba(44,60,95,.55);white-space:nowrap;overflow:hidden}
.ls th{font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.06em}
.ls td.tn{text-align:left;padding-left:0;width:58px}
.ls td.tn span{display:inline-flex;align-items:center;gap:5px}
.ls td.tn i{width:6px;height:16px;background:var(--tc);display:inline-block}
.ls td.r{font-size:16px;color:var(--white);width:26px}
.ls td.cur{background:rgba(255,210,63,.12)}
.ls td.bat{color:var(--flag)}
.ls col.inn{width:auto}
.ls .h,.ls .e{color:var(--mist)}
.sit{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:3px 8px;align-items:center;padding:6px 9px;border-left:1px solid var(--line);min-width:96px}
.sit .inn{font:800 14px/1 var(--f-ui);letter-spacing:.04em;white-space:nowrap}
.sit .cnt{font:800 14px/1 var(--f-ui);font-variant-numeric:tabular-nums;text-align:right}
.diamond{position:relative;width:34px;height:26px;grid-row:span 2}
.diamond i{position:absolute;width:10px;height:10px;transform:rotate(45deg);border:2px solid var(--mist);background:transparent}
.diamond i.on{background:var(--flag);border-color:var(--flag)}
.diamond .b1{right:2px;top:10px} .diamond .b2{left:12px;top:1px} .diamond .b3{left:2px;top:10px}
.outs{display:flex;gap:3px;justify-content:flex-end}
.outs i{width:8px;height:8px;border-radius:50%;border:2px solid var(--mist)}
.outs i.on{background:var(--hp-r);border-color:var(--hp-r)}
.np{font:600 10px/1 var(--f-ui);color:var(--mist);letter-spacing:.06em;text-transform:uppercase;text-align:right;white-space:nowrap}

.scene{position:relative;width:100%;aspect-ratio:3/2;border-radius:12px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 0 0 1px var(--line);background:var(--grass);isolation:isolate;user-select:none;-webkit-user-select:none;cursor:default}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.scene::after{content:"";position:absolute;inset:0;background:var(--white);opacity:0;pointer-events:none;z-index:6}
.scene.flash::after{animation:wflash .45s ease-out}
.scene.dim::after{background:#000;animation:dimA .9s ease-out}
.scene.shake{animation:shake .35s}
@keyframes wflash{0%{opacity:.85}100%{opacity:0}}
@keyframes dimA{0%,40%{opacity:.5}100%{opacity:0}}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.spr{position:absolute;z-index:1;transform:translateX(-50%);overflow:hidden;pointer-events:none;transition:transform .22s ease-out,opacity .22s}
.spr img{display:block;height:100%;width:auto;image-rendering:pixelated;animation:bob 1.1s steps(1) infinite;transition:transform .45s ease-in,opacity .45s}
.spr.opp{left:71.9%;bottom:44%;height:42%}
.spr.opp img{animation-delay:.55s}
.spr.me{left:27%;bottom:2%;height:60%}
.spr.me.away{transform:translateX(-190%);opacity:0}
.spr.opp.away{transform:translateX(90%);opacity:0}
.spr.faint img{animation:none;transform:translateY(105%);opacity:0;transition:transform .8s ease-in,opacity .8s}
@keyframes bob{50%{transform:translateY(2.2%)}}
.spr.lunge-me{animation:lungeMe .45s ease-out}
.spr.lunge-opp{animation:lungeOpp .45s ease-out}
@keyframes lungeMe{40%{transform:translate(-14%,-12%)}}
@keyframes lungeOpp{40%{transform:translate(-88%,12%)}}
.spr.hit img{animation:blink .7s steps(1)}
@keyframes blink{0%,40%,80%{opacity:0}20%,60%,100%{opacity:1}}
.spr.pulse img{animation:pulse .5s}
@keyframes pulse{50%{filter:brightness(1.7) saturate(1.3)}}
.spr.glow img{animation:glowA 1.2s}
@keyframes glowA{25%,75%{filter:brightness(2.1)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.fx i{position:absolute;display:none}
.fx i.on{display:block}
.fx .px{width:7px;height:7px;margin:-3.5px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.fx .px.on{animation:pxfly .55s ease-out forwards}
@keyframes pxfly{from{transform:translate(0,0) scale(1.2);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.fx .ring{width:22px;height:22px;margin:-11px;border:3px solid var(--c);border-radius:50%}
.fx .ring.on{animation:ringA .6s ease-out forwards}
@keyframes ringA{from{transform:scale(1);opacity:1}to{transform:scale(4.5);opacity:0}}
.fx .ball{width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--leather);box-shadow:0 0 0 2px var(--ink),inset -2px 0 0 var(--stitch)}
.fx .ball.on.p0{animation:pthrow0 .42s ease-in forwards}
.fx .ball.on.p1{animation:pthrow1 .42s ease-in forwards}
@keyframes pthrow0{from{transform:translate(0,0) scale(1.3)}to{transform:translate(var(--dx),var(--dy)) scale(.7)}}
@keyframes pthrow1{from{transform:translate(0,0) scale(.7)}to{transform:translate(var(--dx),var(--dy)) scale(1.4)}}
.fx .ball.on.hr{animation:hrfly 1s ease-out forwards}
@keyframes hrfly{50%{transform:translate(40px,-120px) scale(.8)}to{transform:translate(70px,-200px) scale(.3);opacity:0}}

.sbox{position:absolute;z-index:2;width:52%;display:grid;grid-template-columns:minmax(0,1fr);gap:3px;padding:5px 8px 6px 9px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px 10px 10px 3px;box-shadow:3px 3px 0 rgba(5,9,18,.45);font-family:var(--f-pixel)}
.sbox.opp{top:4%;left:3%}
.sbox.me{top:50%;right:3%;border-radius:10px 10px 3px 10px}
.sb-top{display:flex;align-items:center;gap:4px;min-width:0}
.sb-name{flex:1 1 auto;min-width:0;font-weight:600;font-size:clamp(12px,3.5vw,16px);line-height:1.1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-dots{display:flex;gap:2px}
.sb-dots .dot{width:8px;height:8px}
.sb-lv{font-size:clamp(11px,3vw,13px);font-weight:600;white-space:nowrap}
.sb-hp{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;gap:4px}
.hp-lab{font:700 9px/1 var(--f-pixel);letter-spacing:.04em;background:var(--ink);color:var(--flag);padding:2px 3px 1px;border-radius:3px;text-align:center}
.hp-bar{position:relative;display:block;height:9px;background:var(--hp-bg);border:2px solid var(--ink);border-radius:5px;overflow:hidden}
.hp-fill{display:block;height:100%;width:100%;background:var(--hp-g);box-shadow:inset 0 2px 0 rgba(255,255,255,.35);transition:width .4s linear,background-color .25s}
.hp-fill.y{background:var(--hp-y)}
.hp-fill.r{background:var(--hp-r)}
.hp-bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.8}
.sb-meta{display:flex;justify-content:space-between;gap:6px;font-size:clamp(10px,2.8vw,12px);line-height:1.1;font-weight:500}
.sb-meta .role{color:var(--ink-sys);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sb-meta .val{font-weight:600;white-space:nowrap}
.cnt-dots{display:flex;gap:3px;align-items:center}
.cnt-dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.cnt-dots i.b{background:var(--hp-g)} .cnt-dots i.s{background:var(--hp-r)}
.cnt-dots .sep{width:6px}
.sbox.lvl{animation:lvl .9s ease-out}
@keyframes lvl{30%{box-shadow:0 0 0 4px var(--exp),3px 3px 0 rgba(5,9,18,.45)}}
.sbox .fnt{color:var(--ink-hot);font-weight:700}

#panel{min-height:150px}
.frame{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 6px var(--frame);padding:15px 17px 16px;display:grid;gap:12px;font-family:var(--f-pixel)}
.dlg-frame{min-height:126px;align-content:space-between;cursor:pointer;gap:8px}
/* timed swing: a catcher's-eye plate view inside the paper frame */
.swing-frame{gap:8px;padding:12px 12px 10px}
.sw-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sw-chip{background:var(--ink);color:var(--paper);border-radius:6px;padding:5px 9px;font:600 14px/1 var(--f-pixel);letter-spacing:.04em;text-transform:uppercase}
.sw-hint{font:500 13px/1.2 var(--f-body);color:var(--ink-sys)}
.sw-foot{margin:0;font:500 12px/1 var(--f-body);color:var(--ink-sys);text-align:center}
.pad{position:relative;width:100%;aspect-ratio:4/3;max-height:min(46vh,330px);border:2px solid var(--ink);border-radius:9px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair;
  background:radial-gradient(120% 70% at 50% 108%,#b9824f 0 34%,transparent 35%),linear-gradient(#0e1a33,#16294d 62%,#1f3a2a 63%,#2f6b33)}
.pad-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pad .zone{fill:rgba(238,242,248,.05);stroke:rgba(238,242,248,.85);stroke-width:2;stroke-dasharray:6 4}
.pad .zone-g{stroke:rgba(238,242,248,.18);stroke-width:1}
.pad .plate{fill:#f4f2ea;stroke:#1b2131;stroke-width:1.5}
.pad .trail{fill:none;stroke:rgba(255,255,255,.75);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.pad .trail.g-perfect{stroke:var(--flag)}.pad .trail.g-good{stroke:var(--good)}.pad .trail.g-early,.pad .trail.g-late{stroke:#ffa94d}.pad .trail.g-miss{stroke:var(--bad)}
.pball,.pring{position:absolute;left:0;top:0;width:0;height:0;border-radius:50%;pointer-events:none;will-change:transform}
.pball{background:radial-gradient(circle at 35% 32%,#fff 0 40%,#e9e6dc 70%,#c9c4b4);box-shadow:0 0 0 1px rgba(27,33,49,.5),inset -2px -2px 0 rgba(200,49,44,.35)}
.pring{border:3px solid var(--flag);opacity:0}
.pring.hot{border-color:var(--good)}
.pgrade{position:absolute;left:50%;top:12%;transform:translate(-50%,0) scale(.6);opacity:0;font:700 30px/1 var(--f-pixel);letter-spacing:.04em;text-transform:uppercase;color:var(--chalk);text-shadow:2px 2px 0 #0b1322,-1px -1px 0 #0b1322;white-space:nowrap;pointer-events:none}
.pgrade.on{opacity:1;transform:translate(-50%,0) scale(1);transition:transform .18s cubic-bezier(.3,1.6,.6,1),opacity .1s}
.pgrade.on,.psub.on{background:rgba(11,19,34,.78);padding:6px 12px;border-radius:8px}
.pgrade.g-perfect{color:var(--flag)}.pgrade.g-good{color:var(--good)}.pgrade.g-early,.pgrade.g-late{color:#ffa94d}.pgrade.g-miss{color:var(--bad)}.pgrade.g-take{color:var(--mist)}
@media (prefers-reduced-motion:reduce){.pgrade.on{transition:none}}
/* thrown pitch: the view from behind the mound */
.pad.mound{aspect-ratio:1/1;max-height:min(40vh,336px);cursor:grab;
  background:radial-gradient(90% 34% at 50% 100%,#c08a55 0 60%,#b9824f 61%,transparent 62%),linear-gradient(#0e1a33,#16294d 18%,#2f6b33 19%,#3f8f3a 60%,#357d31)}
.pad .batter{fill:rgba(11,19,34,.42)}
.mound .pgrade{top:44%}.mound .psub{top:56%}
.throw-frame .actrow{grid-template-columns:auto 1fr}
.pad .target{fill:rgba(255,255,255,.10);stroke:#fff;stroke-width:2.5}
.pad .tring{fill:none;stroke-width:3.5}
.pad .tring.r-ni{stroke:var(--hp-y)}.pad .tring.r-gr{stroke:#ff9f43}.pad .tring.r-ex{stroke:var(--hp-r)}
.pad .ghost{fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.5;stroke-dasharray:3 3;transition:opacity .2s}
.pad .spin-arrow{fill:none;stroke:rgba(255,255,255,.55);stroke-width:2.5;stroke-dasharray:5 5;marker-end:none}
.pad .trail.a-excellent{stroke:var(--hp-r)}.pad .trail.a-great{stroke:#ff9f43}.pad .trail.a-nice{stroke:var(--hp-y)}.pad .trail.a-off{stroke:#ffa94d}.pad .trail.a-wild{stroke:var(--bad)}
.mball{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;will-change:transform;
  background:radial-gradient(circle at 35% 30%,#fff 0 45%,#ebe7dc 72%,#c9c4b4);box-shadow:0 3px 0 rgba(11,19,34,.45),0 0 0 2px rgba(27,33,49,.6)}
.mball .seam{position:absolute;inset:12%;border-radius:50%;border:2px dashed transparent;border-left-color:var(--stitch);border-right-color:var(--stitch)}
.mball.charged{box-shadow:0 0 0 2px rgba(27,33,49,.6),0 0 18px 6px rgba(255,210,63,.75)}
.spin-meter{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:34%;height:7px;border-radius:4px;background:rgba(11,19,34,.6);overflow:hidden;border:1px solid rgba(255,255,255,.35)}
.spin-meter i{display:block;height:100%;width:0;background:var(--flag)}
.psub{position:absolute;left:50%;top:26%;transform:translateX(-50%);opacity:0;font:600 17px/1 var(--f-pixel);text-transform:uppercase;letter-spacing:.04em;color:var(--chalk);text-shadow:2px 2px 0 #0b1322;white-space:nowrap;pointer-events:none}
.psub.on{opacity:1}.psub.s-hang,.psub.s-soft{color:var(--bad)}.psub.s-sharp,.psub.s-gas{color:var(--good)}
.pgrade.a-excellent{color:var(--hp-r)}.pgrade.a-great{color:#ff9f43}.pgrade.a-nice{color:var(--hp-y)}.pgrade.a-ok{color:var(--chalk)}.pgrade.a-off{color:#ffa94d}.pgrade.a-wild{color:var(--bad)}
.dlg-text{font:500 18px/1.45 var(--f-pixel);min-height:2.9em;white-space:pre-wrap}
.dlg-text.hot{color:var(--ink-hot)} .dlg-text.good{color:var(--ink-good)} .dlg-text.big{color:var(--ink-hot);font-weight:700}
.dlg-text.sys{color:var(--ink-sys)} .dlg-text.hint{color:var(--ink-cold)}
.dlg-foot{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.adv{font-size:12px;opacity:0;width:12px;text-align:center}
.adv.on{opacity:1;animation:blinkA .8s steps(1) infinite}
@keyframes blinkA{50%{opacity:0}}
.mini-b{appearance:none;display:inline-flex;align-items:center;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:7px;padding:5px 9px;font:600 13px/1 var(--f-pixel);letter-spacing:.03em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.key{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--paper);margin-right:7px;font:700 10px/1 var(--f-pixel);flex:none}
.prompt{display:grid;gap:4px}
.pr-big{font:600 19px/1.3 var(--f-pixel);text-wrap:balance}
.pr-sub{font:500 13px/1.35 var(--f-body);color:var(--ink-sys)}
.cmds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmd{position:relative;appearance:none;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:9px;padding:16px 10px 16px 28px;font:600 19px/1 var(--f-pixel);letter-spacing:.05em;text-transform:uppercase;text-align:left;cursor:pointer;box-shadow:inset 0 -4px 0 var(--paper-2)}
.cmd::before{content:"▶";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;opacity:0}
.cmd.cur::before,.cmd:hover::before,.cmd:focus-visible::before{opacity:1}
.cmd.cur{background:var(--ink);color:var(--paper);box-shadow:none}
.cmd[disabled]{opacity:.35;cursor:not-allowed}
.mtabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.mt-title{font:600 16px/1 var(--f-pixel);text-transform:uppercase;letter-spacing:.06em;padding:6px 2px}
.bbtn{margin-left:auto}
.actrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.actrow .bbtn{margin:0;padding:0 14px;font-size:15px;border-radius:10px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mv{position:relative;appearance:none;display:grid;gap:7px;align-content:space-between;min-height:60px;padding:9px 10px 8px 11px;border:2px solid var(--ink);border-radius:10px;background:var(--mtbg,var(--paper-2));color:var(--ink);text-align:left;cursor:pointer;box-shadow:inset 0 -4px 0 var(--mtsh,rgba(0,0,0,.15));min-width:0;font-family:var(--f-pixel)}
.mv .mvn{font:600 16px/1.05 var(--f-pixel);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.mv .mvr{display:flex;justify-content:space-between;align-items:center;gap:6px;font:500 12px/1 var(--f-pixel)}
.mv[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.mv[aria-pressed="true"] .mvn::before{content:"▶ ";font-size:11px;vertical-align:1px}
.mv[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.75)}
.mv.empty{background:transparent;border-style:dashed;border-color:rgba(27,33,49,.35);box-shadow:none;color:var(--ink-sys);cursor:default;place-content:center;text-align:center}
.mv .coach{position:absolute;top:-8px;right:8px;font:700 9px/1 var(--f-pixel);background:var(--flag);color:var(--ink);padding:3px 5px 2px;border-radius:4px;letter-spacing:.05em;border:1.5px solid var(--ink)}
.minfo{display:grid;gap:6px;padding-top:9px;border-top:2px dashed rgba(27,33,49,.22);min-height:70px;align-content:start}
.mi-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font:600 14px/1.2 var(--f-pixel)}
.stab{font:700 11px/1 var(--f-pixel);background:var(--ink);color:var(--flag);padding:4px 6px 3px;border-radius:4px;letter-spacing:.06em}
.mi-desc{font:400 14px/1.35 var(--f-body)}
.mi-desc b{font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{appearance:none;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:7px 11px;font:600 13px/1 var(--f-pixel);text-transform:uppercase;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pill[disabled]{opacity:.35;cursor:not-allowed}
.abtn{appearance:none;display:flex;align-items:center;justify-content:center;width:100%;border:0;border-radius:10px;padding:14px;background:var(--ink);color:var(--paper);font:600 18px/1 var(--f-pixel);letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
.abtn .key{background:var(--flag);color:var(--ink)}
.abtn[disabled]{opacity:.4;cursor:not-allowed}
.bag-list{list-style:none;margin:0;padding:0;display:grid}
.bag-list li{display:grid;gap:6px;padding:10px 0;border-bottom:2px dashed rgba(27,33,49,.18)}
.bag-list li:last-child{border-bottom:0;padding-bottom:0}
.bag-item{appearance:none;position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;background:transparent;border:0;padding:0 0 0 18px;color:var(--ink);font:600 16px/1.1 var(--f-pixel);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;text-align:left;width:100%}
.bag-item::before{content:"▶";position:absolute;left:0;font-size:10px;top:50%;transform:translateY(-50%);opacity:.25}
.bag-item:hover::before,.bag-item:focus-visible::before{opacity:1}
.bag-item.static{cursor:default}
.bag-item.static::before{content:none}
.bag-item[disabled]{opacity:.38;cursor:not-allowed}
.bag-item .sm{font:500 12px/1.2 var(--f-body);text-transform:none;color:var(--ink-sys);letter-spacing:0}
.bag-list p{font:400 13px/1.35 var(--f-body);color:var(--ink-sys);padding-left:18px}
.bag-list .pills{padding-left:18px}
.pick-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.pick-row .who{display:grid;gap:3px;min-width:0}
.pick-row .who b{font:600 15px/1.1 var(--f-pixel);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-row .who span{font:500 12px/1.2 var(--f-body);color:var(--ink-sys)}
.tagc{font:700 10px/1 var(--f-pixel);background:var(--ink);color:var(--paper);padding:3px 5px 2px;border-radius:4px}
.tagc.fnt{background:var(--ink-hot)}
.tagc.coach{background:var(--flag);color:var(--ink)}
.reason{font:600 13px/1.35 var(--f-body);color:var(--ink-hot)}
.reason.flash{animation:reasonflash .6s ease-out 1}
@keyframes reasonflash{0%,40%{transform:translateX(-3px)}20%,60%{transform:translateX(3px)}100%{transform:none}}
.cmd[aria-disabled=true],.lu-row[aria-disabled=true]{opacity:.45}

/* ---------- Sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:var(--scrim-bg);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--deck);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding-top:16px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h3{font:800 20px/1 var(--f-ui);letter-spacing:.05em;text-transform:uppercase}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--night);padding:4px;border-radius:9px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;border-radius:6px;padding:9px 4px;font:700 14px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mist);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--deck-3);color:var(--chalk)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font:600 14px/1.2 var(--f-ui);font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.box-tbl td:first-child{max-width:150px;overflow:hidden;text-overflow:ellipsis}
.box-tbl .st{color:var(--dim);font-size:11px}
.box-tbl .xt{color:var(--bad);font-size:11px;font-weight:800}
.box-tbl tr.sub td:first-child{padding-left:14px;color:var(--mist)}
.chart th,.chart td{padding:5px 3px;font-size:12px;letter-spacing:.02em}
.chart td{text-align:center;font-weight:800}
.chart td.p2,.chart td.p1{color:var(--good)} .chart td.m1,.chart td.m2{color:var(--bad)} .chart td.z{color:var(--dim)} .chart td.x{color:#000;background:var(--bad)}
.tchart{border-collapse:collapse;font:700 10px/1 var(--f-ui)}
.tchart th,.tchart td{width:19px;height:19px;padding:0;text-align:center;border:1px solid rgba(44,60,95,.6)}
.tchart th.r{writing-mode:horizontal-tb;text-align:right;padding-right:4px;width:auto;white-space:nowrap}
.tchart th.c{height:auto;padding:3px 0}
.tchart th.c span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.tchart td.s{background:#2e7d32;color:#fff} .tchart td.n{background:#7f2a24;color:#fff} .tchart td.z{background:#000;color:#fff}
.log-item{display:grid;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.log-item .ts{font:700 11px/1 var(--f-ui);letter-spacing:.1em;color:var(--mist);text-transform:uppercase}
.log-item p{font:500 14px/1.35 var(--f-pixel)}
.notes p{font:500 13px/1.4 var(--f-body);color:var(--mist)}

/* ---------- Postgame ---------- */
.score-hero{display:grid;gap:10px;text-align:center;padding:22px 14px;border-radius:14px;background:var(--deck);border:1px solid var(--line)}
.score-hero .verdict{font:400 clamp(34px,10vw,52px)/1 var(--f-display)}
.score-hero .verdict.w{color:var(--flag)}
.score-line{display:flex;justify-content:center;align-items:center;gap:16px;font:800 44px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.score-line small{display:block;font:400 14px/1 var(--f-display);color:var(--mist);margin-bottom:4px}
.mvp{display:flex;align-items:center;gap:12px}
.evo{display:grid;gap:4px;padding:12px 14px;border-radius:10px;background:var(--deck-2);animation:evo 1.6s ease-out 1}
.evo b{font:600 16px/1.2 var(--f-pixel)}
.evo .stl{display:flex;flex-wrap:wrap;gap:4px 10px;font:500 12px/1.3 var(--f-body);color:var(--mist)}
.evo .stl em{font-style:normal;color:var(--good)}
@keyframes evo{0%{background:var(--white);color:var(--ink)}35%{background:var(--white);color:var(--ink)}100%{background:var(--deck-2)}}
.champ{font:400 clamp(40px,12vw,64px)/.95 var(--f-display);color:var(--flag);text-align:center;text-wrap:balance}

/* ---------- Editor ---------- */
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.filters input{grid-column:1/-1}
.filters input,.filters select{background:var(--deck);border:1px solid var(--line);border-radius:8px;padding:9px 8px;font:500 15px var(--f-body);min-width:0}
.pool{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--deck)}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.pr:last-child{border-bottom:0}
.pr:hover{background:var(--deck-2)}
.pr .nm{font:600 15px/1.2 var(--f-body)}
.pr .sub{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;align-items:center}
.pr .rt{font:800 24px/1 var(--f-ui);font-variant-numeric:tabular-nums;text-align:right}
.empty-pool{padding:20px;text-align:center;color:var(--mist)}
.ed-grid{display:grid;gap:10px}
.sl{display:grid;grid-template-columns:76px minmax(0,1fr) 34px;gap:8px;align-items:center}
.sl label{font:700 13px/1.1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
.sl input[type=range]{width:100%;accent-color:var(--flag)}
.sl output{font:800 16px/1 var(--f-ui);text-align:right;font-variant-numeric:tabular-nums}
.sl .real{grid-column:2/-1;font:500 12px/1.2 var(--f-body);color:var(--dim);margin-top:-6px}
.sl.mod output{color:var(--flag)}
.proj{background:var(--deck-2);border-radius:10px;padding:10px 12px;font:600 15px/1.3 var(--f-ui);letter-spacing:.02em}
.pitch-ed{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}
.pitch-ed .row select,.pitch-ed .row input{background:var(--night);border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-width:0}
.inl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inl label{display:grid;gap:4px;font:600 12px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.inl input,.inl select,textarea.field-in{background:var(--night);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:500 15px var(--f-body);min-width:0;width:100%}
textarea.field-in{min-height:140px;font:500 12px/1.4 ui-monospace,monospace}
.ivgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ivgrid label{display:grid;gap:3px;font:600 11px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
.ivgrid input{background:var(--night);border:1px solid var(--line);border-radius:6px;padding:7px 6px;width:100%}
.card>.row>select[data-ed]{background:var(--night);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:500 15px var(--f-body);min-width:0;flex:1}
.custom-tag{font:800 10px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;background:var(--flag);color:var(--flag-ink);padding:3px 6px;border-radius:4px}
.dock{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:4;display:flex;gap:8px;padding:10px;background:var(--deck);border:1px solid var(--line);border-radius:12px;box-shadow:0 -8px 22px rgba(0,0,0,.35)}
.dock .btn{flex:1 1 auto}

@media (max-width:370px){
  .mv .mvn{font-size:14px}
  .cmd{font-size:17px;padding-block:14px}
  .filters{grid-template-columns:1fr 1fr}
  .ls td.tn{width:46px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
