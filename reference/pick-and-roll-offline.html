<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pick &amp; Roll</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=Graduate&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column under arena lights. Menus use a broadcast look; the game screen is a
   handheld battle view: scorebug, pixel arena scene with status boxes, then a paper text frame that
   holds the play-by-play and the play menus. */
:root{
  color-scheme: dark;
  --night:#0b1322;
  --deck:#131d31;
  --deck-2:#1a2742;
  --deck-3:#243659;
  --line:#2c3c5f;
  --chalk:#eef2f8;
  --white:#ffffff;
  --mist:#9cabc5;
  --dim:#6c7b99;
  --flag:#ffd23f;
  --flag-ink:#2a2200;
  --scrim:#4f8dff;
  --wood:#c98a4b;
  --wood-2:#b9793c;
  --wood-line:rgba(90,45,10,.28);
  --leather:#e2742b;
  --paper:#f7f7f1;
  --paper-2:#e6e3d6;
  --ink:#1b2131;
  --ink-hot:#b42b1f;
  --ink-cold:#2357b5;
  --ink-sys:#5d6a85;
  --ink-good:#1d7a43;
  --hp-g:#3fcb6a;
  --hp-y:#f1c12c;
  --hp-r:#e5483a;
  --hp-bg:#3a4256;
  --exp:#3f9cf5;
  --frame:#b42b1f;
  --good:#5fd38a;
  --bad:#ff7466;
  --glow:rgba(255,236,190,.085);
  --scrim-bg:rgba(5,9,18,.66);
  --f-display:'Graduate','Rockwell','Courier New',serif;
  --f-ui:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-pixel:'Pixelify Sans',ui-monospace,'Courier New',monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--night);background-image:radial-gradient(70% 34% at 10% -6%,var(--glow),transparent 70%),radial-gradient(70% 34% at 90% -6%,var(--glow),transparent 70%);background-repeat:no-repeat;color:var(--chalk);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.frame :focus-visible,.sbox :focus-visible{outline-color:var(--ink-cold)}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pix{image-rendering:pixelated}
.eyebrow{font:600 12px/1.1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.muted{color:var(--mist);font-size:14px}
.h2{font:400 26px/1.05 var(--f-display);text-wrap:balance}
.card{background:var(--deck);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;min-width:0}
.card h3{font:700 17px/1.1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 16px;font:700 17px/1 var(--f-ui);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;background:var(--deck-3);color:var(--chalk);text-align:center}
.btn.primary{background:var(--flag);color:var(--flag-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mist)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:8px 11px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.chip-btn{border:1px solid var(--line);background:var(--deck);border-radius:7px;padding:7px 10px;font:700 13px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mist);cursor:pointer;white-space:nowrap}
.chip-btn[aria-pressed="true"]{color:var(--chalk)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.ty{display:inline-flex;align-items:center;padding:2px 6px;border-radius:4px;background:var(--ty);color:var(--tyfg);font:700 11px/1.25 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ty);flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.eff{display:inline-block;font:800 13px/1 var(--f-ui);padding:3px 5px;border-radius:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.eff.up{background:var(--good);color:var(--night)}
.eff.dn{background:var(--bad);color:var(--night)}
.eff.n{color:var(--dim);border:1px solid var(--line)}
.frame .eff.n{color:var(--ink-sys);border-color:rgba(27,33,49,.35)}
.tag{display:inline-block;padding:3px 7px;border-radius:5px;background:var(--deck-2);border:1px solid var(--line);color:var(--chalk);font:600 13px/1.1 var(--f-ui);letter-spacing:.02em}
.tag.up{border-color:var(--good);color:var(--good)}
.tag.dn{border-color:var(--bad);color:var(--bad)}

/* ---------- Title ---------- */
.hero{position:relative;border-radius:14px;overflow:hidden;isolation:isolate;background:repeating-linear-gradient(0deg,var(--wood) 0 22px,var(--wood-2) 22px 24px);padding:30px 18px 22px;border:2px solid #8f5a26}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(90deg,var(--wood-line) 0 1px,transparent 1px 64px),linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,0) 40%,rgba(0,0,0,.2))}
.hero .key{position:absolute;right:-8%;top:-30%;width:58%;height:96%;border:4px solid rgba(255,255,255,.85);border-radius:0 0 50% 50%/0 0 32% 32%;background:rgba(0,107,182,.55);z-index:0}
.hero .arc{position:absolute;right:-30%;top:-58%;width:96%;height:150%;border:4px solid rgba(255,255,255,.75);border-radius:50%;z-index:0}
.hero-in{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 8px;align-items:end}
.hero-copy{display:grid;gap:12px;min-width:0}
.hero-spr{width:clamp(78px,24vw,120px);height:auto;image-rendering:pixelated;filter:drop-shadow(0 5px 0 rgba(0,0,0,.28))}
.wordmark{font:400 clamp(50px,15.5vw,86px)/.9 var(--f-display);color:var(--white);text-shadow:0 4px 0 rgba(0,0,0,.35);letter-spacing:.01em}
.hero-tag{font:500 16px/1.4 var(--f-body);color:var(--white);max-width:34ch;text-shadow:0 1px 2px rgba(0,0,0,.4);grid-column:1/-1}
.on-turf{color:var(--white);opacity:.9}
.setup label,.setup .lbl{display:block;font:600 12px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mist);margin-bottom:6px}
.field-in{width:100%;background:var(--night);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:500 16px var(--f-body)}
.two-col{display:grid;grid-template-columns:1fr 92px;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--night);padding:4px;border-radius:9px;border:1px solid var(--line)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;text-align:center;padding:9px 4px;border-radius:6px;cursor:pointer;font:700 14px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--mist)}
.seg input:checked+label{background:var(--deck-3);color:var(--chalk)}
.seg input:focus-visible+label{outline:2px solid var(--flag)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches input{position:absolute;opacity:0;pointer-events:none}
.swatches label{width:34px;height:34px;border-radius:50%;background:var(--sw);cursor:pointer;margin:0;border:3px solid var(--deck);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked+label{box-shadow:0 0 0 3px var(--flag)}
.swatches input:focus-visible+label{outline:2px solid var(--flag)}
.how{display:grid;gap:10px}
.how div{display:grid;gap:3px;padding:12px 14px;border-left:3px solid var(--line)}
.how b{font:700 16px/1.1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
.how p{color:var(--mist);font-size:14px}
.resume{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}

/* ---------- Draft ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cap{display:grid;gap:6px}
.cap-row{display:flex;justify-content:space-between;align-items:baseline}
.cap-num{font:800 20px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--deck-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--flag)}
.cap.over .bar i{background:var(--bad)}
.cap.over .cap-num{color:var(--bad)}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slots .sep{grid-column:1/-1;font:600 11px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:2px}
.slot{border:2px solid var(--line);background:var(--deck);border-radius:8px;padding:6px 2px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.slot .p{font:800 13px/1 var(--f-ui);letter-spacing:.08em;color:var(--mist)}
.slot .r{font:800 19px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.slot .n{font:500 10px/1.1 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mist);padding:0 2px;max-width:100%}
.slot-spr{display:block;width:34px;height:41px;image-rendering:pixelated}
.slot-spr.ph{border:2px dashed var(--line);border-radius:6px}
.slot[aria-pressed="true"]{border-color:var(--flag);background:var(--deck-2)}
.slot.empty .r{color:var(--dim)}
.occ{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.occ .nm{font:600 16px var(--f-body)}
.occ-spr{width:40px;height:48px;image-rendering:pixelated}
.hint{font-size:14px;line-height:1.9;color:var(--mist)}
.hint .ty{margin-right:3px;vertical-align:1px}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.filters input{grid-column:1/-1}
.filters input,.filters select{background:var(--deck);border:1px solid var(--line);border-radius:8px;padding:9px 8px;font:500 15px var(--f-body);min-width:0}
.pool{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--deck)}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%}
.pr:last-child{border-bottom:0}
.pr:hover:not([disabled]){background:var(--deck-2)}
.pr[disabled]{opacity:.42;cursor:not-allowed}
.pr .nm{font:600 15px/1.2 var(--f-body)}
.pr .sub{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;align-items:center}
.pr .rt{font:800 26px/1 var(--f-ui);font-variant-numeric:tabular-nums;text-align:right}
.pr .ct{font:700 16px/1 var(--f-ui);color:var(--flag);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.note{font:600 12px/1.2 var(--f-ui);color:var(--mist);letter-spacing:.04em}
.note.up{color:var(--good)} .note.dn{color:var(--bad)}
.dock{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:4;display:grid;grid-template-columns:auto auto 1fr;gap:8px;padding:10px;background:var(--deck);border:1px solid var(--line);border-radius:12px;box-shadow:0 -8px 22px rgba(0,0,0,.35)}
.empty-pool{padding:20px;text-align:center;color:var(--mist)}

/* ---------- Party cards ---------- */
.party{display:grid;gap:8px}
.pc{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--deck-2);border:1px solid var(--line)}
.pc-spr{width:40px;height:48px;image-rendering:pixelated;justify-self:center}
img.custom{object-fit:contain}
img.flip{scale:-1 1}
.spr img.custom{max-width:none}
.pc-main{display:grid;gap:4px;min-width:0}
.pc-top{display:flex;align-items:baseline;gap:8px;min-width:0}
.pc-pos{font:800 12px/1 var(--f-ui);letter-spacing:.08em;color:var(--flag)}
.pc-name{font:600 16px/1.1 var(--f-pixel);flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-lv{font:600 13px/1 var(--f-pixel);color:var(--mist)}
.pc-sub{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pc-bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center}
.pc-r{font:800 16px/1 var(--f-ui);font-variant-numeric:tabular-nums;min-width:24px;text-align:right}

/* ---------- Hub ---------- */
.team-head{display:grid;gap:8px}
.team-name{font:400 clamp(28px,8vw,40px)/1 var(--f-display);text-wrap:balance}
.stats-line{display:flex;gap:16px;flex-wrap:wrap}
.stat b{display:block;font:800 26px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.stat span{font:600 11px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}
.badges{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;list-style:none;padding:0;margin:0}
.badge{display:grid;justify-items:center;gap:4px;font:600 10px/1.1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:center}
.badge i{width:30px;height:30px;border-radius:50%;border:2px dashed var(--line)}
.badge.got{color:var(--chalk)}
.badge.got i{border:3px solid var(--white);background:var(--bc);box-shadow:0 0 0 2px var(--bc)}
.leader-name{font:400 30px/1 var(--f-display)}
.trait{background:var(--deck-2);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.trait b{font:700 15px/1.1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--flag)}
.trait p{font-size:14px;color:var(--chalk)}
.tend{display:flex;flex-wrap:wrap;gap:6px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.mrow .who{display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-width:0}
.sched ol{list-style:none;padding:0;margin:0}
.sched li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.sched li:last-child{border-bottom:0}
.wk{font:700 13px/1 var(--f-ui);letter-spacing:.06em;color:var(--mist);text-transform:uppercase}
.res{font:800 15px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.res.w{color:var(--good)} .res.l{color:var(--bad)}
.sched li.next{background:linear-gradient(90deg,var(--deck-2),transparent)}

/* ---------- Battle ---------- */
.g-wrap{display:flex;flex-direction:column;gap:12px}
.g-top{display:flex;align-items:center;gap:8px}
.g-title{flex:1 1 auto;min-width:0;font:600 13px/1.1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#bug{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bug{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;background:var(--deck);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.bug .tm{display:flex;align-items:center;gap:7px;padding:7px 9px 7px 0;border-right:1px solid var(--line);min-width:0}
.bug .sw{width:7px;align-self:stretch;background:var(--tc);flex:none}
.bug .id{display:grid;gap:4px;min-width:0}
.bug .ab{font:400 15px/1 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tos{display:flex;gap:3px}
.tos i{width:9px;height:3px;border-radius:2px;background:var(--flag)}
.tos i.used{background:var(--line)}
.pball{width:10px;height:10px;border-radius:50%;background:var(--leather);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);flex:none}
.bug .sc{margin-left:auto;font:800 30px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.bug .clk{padding:6px 10px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:3px;min-width:92px}
.bug .t{font:800 18px/1 var(--f-ui);font-variant-numeric:tabular-nums;white-space:nowrap}
.bug .dd{font:800 13px/1 var(--f-ui);color:var(--flag);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.bug .spot{font:600 11px/1 var(--f-ui);color:var(--mist);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.bug.flash{animation:bugflash 1.2s ease-out 1}
@keyframes bugflash{0%,30%{box-shadow:0 0 0 3px var(--flag),0 8px 20px rgba(0,0,0,.4)}100%{box-shadow:0 8px 20px rgba(0,0,0,.4)}}

.scene{position:relative;width:100%;aspect-ratio:3/2;border-radius:12px;overflow:hidden;border:3px solid var(--ink);box-shadow:0 0 0 1px var(--line);background:var(--wood);isolation:isolate;user-select:none;-webkit-user-select:none;cursor:default}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.scene::after{content:"";position:absolute;inset:0;background:var(--white);opacity:0;pointer-events:none;z-index:6}
.scene.flash::after{animation:wflash .45s ease-out}
.scene.shake{animation:shake .35s}
@keyframes wflash{0%{opacity:.85}100%{opacity:0}}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.spr{position:absolute;z-index:1;transform:translateX(-50%);overflow:hidden;pointer-events:none;transition:transform .22s ease-out,opacity .22s}
.spr img{display:block;height:100%;width:auto;image-rendering:pixelated;animation:bob 1.1s steps(1) infinite;transition:transform .45s ease-in}
.spr.opp{left:71.9%;bottom:47%;height:40%}
.spr.opp img{animation-delay:.55s}
.spr.me{left:27%;bottom:3%;height:58%}
.spr.me.away{transform:translateX(-190%);opacity:0}
.spr.opp.away{transform:translateX(90%);opacity:0}
.spr.down img{animation:none;transform:translateY(105%)}
@keyframes bob{50%{transform:translateY(2.2%)}}
.spr.lunge-me{animation:lungeMe .45s ease-out}
.spr.lunge-opp{animation:lungeOpp .45s ease-out}
@keyframes lungeMe{40%{transform:translate(-14%,-12%)}}
@keyframes lungeOpp{40%{transform:translate(-88%,12%)}}
.spr.hit img{animation:blink .7s steps(1)}
@keyframes blink{0%,40%,80%{opacity:0}20%,60%,100%{opacity:1}}
.spr.nudge{animation:nudge .3s}
@keyframes nudge{30%{transform:translateX(-45%)}65%{transform:translateX(-55%)}}
.spr.pulse img{animation:pulse .5s}
@keyframes pulse{50%{filter:brightness(1.7) saturate(1.3)}}
.spr.glow img{animation:glowA 1.2s}
@keyframes glowA{25%,75%{filter:brightness(2.1)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.fx i{position:absolute;display:none}
.fx i.on{display:block}
.fx .px{width:7px;height:7px;margin:-3.5px;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.fx .px.on{animation:pxfly .55s ease-out forwards}
@keyframes pxfly{from{transform:translate(0,0) scale(1.2);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.fx .ring{width:22px;height:22px;margin:-11px;border:3px solid var(--c);border-radius:50%}
.fx .ring.on{animation:ringA .6s ease-out forwards}
@keyframes ringA{from{transform:scale(1);opacity:1}to{transform:scale(4);opacity:0}}
.fx .flagd{left:50%;top:-14px;width:16px;height:11px;background:var(--flag);box-shadow:0 0 0 2px var(--ink)}
.fx .flagd.on{animation:flagdrop 1.1s ease-in forwards}
@keyframes flagdrop{0%{transform:translate(-50%,0) rotate(0)}70%{transform:translate(-20%,120px) rotate(250deg)}100%{transform:translate(-20%,120px) rotate(250deg);opacity:0}}
.fx .kball{width:11px;height:11px;margin:-5px;border-radius:50%;background:var(--leather);box-shadow:0 0 0 2px var(--ink)}
.fx .kball.on.k0{animation:kme .9s ease-out forwards}

   the play-vs-scheme chart, the passer, fatigue, and the home-court traits. */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let RNG=Math.random;

const pick=a=>a[Math.floor(rnd()*a.length)];
function wpick(items,wf){let t=0;const ws=items.map(x=>{const w=Math.max(0,wf(x));t+=w;return w;});if(t<=0)return items[0];let r=rnd()*t;for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i];}return items[items.length-1];}

/* ---------- Defensive schemes ---------- */

const MATRIX={

const DIFF={rookie:{label:'Rookie',ai:-0.055,smart:0.3,adapt:5},pro:{label:'Pro',ai:-0.01,smart:0.65,adapt:3},allstar:{label:'All-Star',ai:0.008,smart:0.9,adapt:2}};

/* ---------- Rosters and lineups ---------- */
// Best five starters with sensible positions, then the next three off the bench.
function bestLineup(names){
  const ps=names.map(n=>PBYN[n]).filter(Boolean).sort((a,b)=>b.ovr-a.ovr).slice(0,10);
  const pen=d=>[0,2,7,14,20][d];

  const n=ps.length,idx=[...Array(n).keys()];
  const combos=(arr,k,start=0,cur=[],out=[])=>{if(cur.length===k){out.push(cur.slice());return out;}for(let i=start;i<arr.length;i++){cur.push(arr[i]);combos(arr,k,i+1,cur,out);cur.pop();}return out;};
  const perms=a=>a.length<=1?[a]:a.flatMap((x,i)=>perms(a.slice(0,i).concat(a.slice(i+1))).map(p=>[x,...p]));
  const P5=perms([0,1,2,3,4]);
  for(const c of combos(idx,Math.min(5,n))){
    const base=c.reduce((s,i)=>s+ps[i].ovr,0);
    for(const pm of P5){if(pm.length!==c.length)continue;let v=base;for(let k=0;k<c.length;k++)v-=pen(posDist(ps[c[pm[k]]].pos,POS[k]));if(v>bestV){bestV=v;best=pm.map(k=>c[k]);}}
  }
  const R={};POS.forEach((s,k)=>R[s]=best&&best[k]!=null?ps[best[k]].name:null);
  const rest=ps.filter(p=>!Object.values(R).includes(p.name)).slice(0,3);
  ['B1','B2','B3'].forEach((s,k)=>R[s]=rest[k]?rest[k].name:null);
  return R;
}
function rosterNames(ab,exclude){return PLAYERS.filter(p=>p.team===ab&&!(exclude&&exclude.has(p.name))).map(p=>p.name);}
function teamStrength(R){const w=[1.3,1.2,1.1,1,1,0.8,0.7,0.6];let s=0,t=0;SLOTS.forEach((k,i)=>{if(R[k]){s+=PBYN[R[k]].ovr*w[i];t+=w[i];}});return t?s/t:0;}

/* ---------- Season ---------- */
const PLAYOFF_WINS=6,PLAYIN_WINS=5,START_CAP=60;
function newSeason(o){

    roster:{},cap:START_CAP,phase:'draft',week:0,results:[],done:false,outcome:null,schedule:[],game:null,last:null,ver:1};
  SLOTS.forEach(s=>S.roster[s]=null);

}
function makeSchedule(S){

  const reg=[28,26,24,21,18,15,12,9,6,4].map(i=>pool[Math.min(i,pool.length-1)]);
  const fin=boss||pool[0];

}
function rosterList(S){return SLOTS.map(s=>S.roster[s]).filter(Boolean);}

function rosterFull(S){return SLOTS.every(s=>S.roster[s]);}
// What's next on the schedule: {ab, label, round}
function nextGame(S){
  if(S.done)return null;
  const W=S.results.filter(r=>r.win).length,n=S.results.length;
  if(S.week<10)return{ab:S.schedule.reg[S.week],label:`Game ${S.week+1} of 10`,round:'reg'};
  const ps=S.results.filter(r=>r.round!=='reg');
  const regW=S.results.filter(r=>r.round==='reg'&&r.win).length;
  const stage=S.stage||(regW>=PLAYOFF_WINS?'semi':regW>=PLAYIN_WINS?'playin':null);
  if(!stage)return null;

}

function autoFill(S){

  for(const s of SLOTS){

    const left=S.cap-capUsed(S);const slotsLeft=SLOTS.filter(x=>!S.roster[x]).length-1;
    const budget=left-slotsLeft*2;
    const want=s.startsWith('B')?null:s;
    const cands=PLAYERS.filter(p=>!mine.has(p.name)&&cost(p.name)<=Math.max(1,budget)&&(!want||posDist(p.pos,want)<=1));
    const per=budget/(slotsLeft+1);
    const best=cands.sort((a,b)=>(b.ovr-Math.max(0,cost(b.name)-per*1.6)*0.6-(want&&b.pos!==want?3:0))-(a.ovr-Math.max(0,cost(a.name)-per*1.6)*0.6-(want&&a.pos!==want?3:0)))[0];

}

/* ---------- Game setup ---------- */
function mkGamePlayer(name,slot){const p=PBYN[name];return Object.assign(Object.create(p),{name,slot,orig:slot,home:POS.indexOf(slot),st:100,heat:0,b:{pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,orb:0,drb:0,ast:0,stl:0,blk:0,tov:0,poss:0}});}

}
function newGame(S){

    scheme:['man','man'],timeouts:[3,3],drawn:[0,0],autoSubs:true,lines:[],log:[],qscore:[[0,0,0,0],[0,0,0,0]],

/* ---------- Narration ---------- */
// Every line carries a snapshot so the presentation can replay the possession step by step.
function snap(g,mu){
  const m=mu||g.mu||defaultMU(g);
  const box=(side,p)=>p?{name:p.name,slot:p.slot,st:Math.round(p.st),pts:p.b.pts,heat:p.heat,pos:p.pos,ovr:p.ovr}:null;
  return{score:g.score.slice(),q:g.q,clock:g.clock,poss:g.poss,ot:g.ot,over:g.over,scheme:g.scheme.slice(),to:g.timeouts.slice(),
    u:box(0,m[0]),o:box(1,m[1]),ball:m.ball,qsec:g.qsec};
}

/* ---------- Shot model ---------- */
function slotOf(T,p){return T.on.indexOf(p);}
function protector(T){return T.on.reduce((a,b)=>b.rimD>a.rimD?b:a);}
function bestBy(T,f,ex){return T.on.filter(p=>p!==ex).reduce((a,b)=>f(b)>f(a)?b:a);}
function baseZone(p,z){return z==='rim'?p.pr:z==='short'?p.ps:z==='mid'?p.pm:p.p3;}
function quarterBonus(g,side){const T=g.teams[side];if(T.trait==="champ")return g.q>=4?0.04:0.015;return 0;}
// Resolve who actually shoots and who passes for a call
function resolveCall(g,side,p,key){
  const M=MOVES[key],T=g.teams[side];
  if(M.kick){const shooter=M.kick==='three'?bestBy(T,x=>x.p3*100+x.v3,p):bestBy(T,x=>x.pr*100+x.rim*0.2,p);return{shooter,passer:p};}

function makeProb(g,side,shooter,key,passer){
  const M=MOVES[key],D=g.teams[1-side],T=g.teams[side],sch=g.scheme[1-side];

  let p=baseZone(shooter,z)+M.adj+MATRIX[M.tag][sch]*STEP+CAL[z];

  if(D.trait==='pressure')t*=1.2;

/* ---------- Possessions ---------- */
const lum2=h=>{const n=parseInt(String(h).slice(1),16)||0;return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255;};
const fmtClock=s=>{s=Math.max(0,Math.ceil(s));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
const ord=n=>['','1st','2nd','3rd','4th'][n]||n+'th';
function drain(g){
  for(const side of [0,1]){const T=g.teams[side];const dm=Math.max(DEFS[g.scheme[0]].drain,DEFS[g.scheme[1]].drain);
    for(const p of T.on){p.st=clamp(p.st-2.3*Math.sqrt(34/Math.max(18,p.mpg))*dm,0,100);p.b.poss++;}
    for(const p of T.bench)p.st=clamp(p.st+4,0,100);}
}
function scoreAdd(g,side,pts){g.score[side]+=pts;if(!g.ot)g.qscore[side][Math.min(3,g.q-1)]+=pts;if(g.lastScorer===side)g.runs[side]+=pts;else{g.runs[side]=pts;g.runs[1-side]=0;}g.lastScorer=side;}

// One possession for `side`. call = {p, key}. Returns nothing; narrates into g.lines.
function runPossession(g,side,call){
  const O=g.teams[side],D=g.teams[1-side],M=MOVES[call.key];
  const t0=g.clock;
  let time=(M.time+3)*(100/(O.pace||100))+(rnd()*6-3);
  if(O.trait==='pace')time-=2;
  if(g.drawn[side])time+=1;
  const lastShot=g.clock<=26;
  if(lastShot)time=Math.max(1,g.clock-1-rnd()*1.5);
  time=clamp(time,3,24);
  const {shooter,passer}=resolveCall(g,side,call.p,call.key);
  const handler=passer||call.p;
  const k=Math.max(0,slotOf(O,shooter)),md=D.on[k]||D.on[0];
  setMU(g,shooter,md);
  const q=MATRIX[M.tag][g.scheme[1-side]];
  g.seen.off[side][M.tag]=(g.seen.off[side][M.tag]||0)+1;
  const who=g.teams[side].abbr;
  say(g,`${who} runs ${M.name}${lastShot&&g.clock>3?' for the last shot':''}!`,side===0?'':'sys','call');
  if(M.kick)say(g,`${lastName(call.p.name)} ${M.kick==='three'?'drives and kicks it out to':'draws the big and dishes to'} ${lastName(shooter.name)}...`,'','pass');
  else if(M.assist)say(g,`${lastName(passer.name)} finds ${lastName(shooter.name)}...`,'','pass');
  if(q>=2)say(g,`${DEFS[g.scheme[1-side]].name} can't handle it! Wide open!`,'cold','super');
  else if(q<=-2)say(g,`${D.abbr} saw it coming. ${DEFS[g.scheme[1-side]].short} takes it away.`,'hot','weak');
  g.drawn[side]=0;
  g.clock=Math.max(0,g.clock-time);
  // turnover
  if(rnd()<tovProb(g,side,handler,call.key)){
    handler.b.tov++;
    const steal=rnd()<0.55;
    if(steal){const thief=wpick(D.on,x=>x.stl+0.5);thief.b.stl++;setMU(g,handler,thief);say(g,`Stolen by ${lastName(thief.name)}!`,'hot','steal');if(rnd()<0.62&&g.clock>3)g.fast=1-side;}
    else say(g,pick([`${lastName(handler.name)} throws it away. Turnover.`,`${lastName(handler.name)} loses the handle. Turnover.`,`Traveling on ${lastName(handler.name)}.`,`Offensive foul on ${lastName(shooter.name)}.`]),'hot','tov');
    shooter.heat=0;
    return;
  }
  shootAndFinish(g,side,shooter,call.key,passer,0);
}
function shootAndFinish(g,side,shooter,key,passer,depth){
  const O=g.teams[side],D=g.teams[1-side],M=MOVES[key];
  const z=depth>0?(key==='putback'?'rim':'three'):(M.kick==='three'?'three':M.kick==='rim'?'rim':M.zone);
  const pts=ZONE_PTS[z];
  let pm=depth>0?(key==='putback'?clamp(shooter.pr+0.02-(protector(D).rimD-50)*0.0012,0.3,0.85):makeProb(g,side,shooter,'spot',null)):makeProb(g,side,shooter,key,passer);
  const fp=depth>0?(key==='putback'?0.12:0.012):foulProb(shooter,z,key);
  shooter.b.fga++;if(pts===3)shooter.b.tpa++;
  const desc={rim:pick(['goes up at the rim','attacks the basket','rises for the finish']),short:pick(['floats one up','spins into a hook','goes up in the paint']),mid:pick(['pulls up from 17 feet','rises from the elbow','fires the mid-range jumper']),three:pick(['lets it fly from three','fires from deep','rises from beyond the arc'])}[z];
  say(g,`${lastName(shooter.name)} ${desc}...`,'','shot');
  const fouled=rnd()<fp;
  const made=rnd()<pm*(fouled?0.55:1);
  if(made){
    shooter.b.fgm++;if(pts===3)shooter.b.tpm++;shooter.b.pts+=pts;scoreAdd(g,side,pts);
    if(passer){passer.b.ast++;}else if(rnd()<(pts===3?shooter.ast3:0.45)){const a=bestBy(O,x=>x.pass,shooter);a.b.ast++;}
    shooter.heat=Math.min(4,shooter.heat+1);
    const big=z==='rim'&&shooter.dunks>40&&rnd()<0.6;
    say(g,`${big?'Slams it home!':pts===3?'Bang! Three points!':'It\'s good!'}${fouled?' And one!':''}`,side===0?'cold':'hot',pts===3?'three':big?'dunk':'score');
    if(fouled){say(g,`${lastName(shooter.name)} to the line for one.`,'sys','line');const m=freeThrows(g,side,shooter,1);say(g,m?'Completes the three-point play.':'Misses the free throw.','',m?'ft':'ftmiss');}
    if(shooter.heat===3)say(g,`${lastName(shooter.name)} is heating up!`,'cold','fire');
    return;
  }
  if(fouled){
    const n=pts;say(g,`Fouled on the shot! ${n} free throws.`,'sys','foul');
    const m=freeThrows(g,side,shooter,n);
    say(g,m===n?`Knocks down all ${n}.`.replace('all 2','both'):m===0?'Misses them all.':`Makes ${m} of ${n}.`,'','ft');
    if(m<n&&rnd()<0.14){reboundOff(g,side,shooter,depth);return;}
    return;
  }
  shooter.heat=0;
  if((z==='rim'||z==='short')&&rnd()<clamp(protector(D).blk*0.03,0.02,0.24)){const bl=protector(D);bl.b.blk++;setMU(g,shooter,bl);say(g,`Rejected by ${lastName(bl.name)}!`,'hot','block');}
  else say(g,pick(['No good.','Off the rim.','In and out!','Short.','Clanks off the iron.']),'hot','miss');
  rebound(g,side,shooter,depth);
}
function rebound(g,side,shooter,depth){
  const O=g.teams[side],D=g.teams[1-side];
  const ob=O.on.reduce((a,p)=>a+p.orb,0)*(O.trait==='glass'?1.25:1),db=D.on.reduce((a,p)=>a+p.drb,0)*(g.scheme[1-side]==='zone'?0.92:1);
  const pO=clamp(ob/(ob+db*1.15),0.1,0.42);
  if(rnd()<pO&&depth<2){reboundOff(g,side,shooter,depth);return;}
  const r=wpick(D.on,x=>x.drb+1);r.b.drb++;
  say(g,`${lastName(r.name)} grabs the rebound.`,'','reb');
  if(rnd()<0.1+(D.trait==='pace'?0.08:0)&&g.clock>3)g.fast=1-side;
}
function reboundOff(g,side,shooter,depth){
  const O=g.teams[side];const r=wpick(O.on,x=>x.orb+0.5);r.b.orb++;
  setMU(g,r,g.teams[1-side].on[Math.max(0,slotOf(O,r))]);
  say(g,`Offensive rebound, ${lastName(r.name)}!`,'cold','oreb');
  g.clock=Math.max(0,g.clock-(3+rnd()*4));
  if(g.clock<=0){say(g,'Time runs out before the putback.','sys','buzzer');return;}
  if(r.rim>=55&&rnd()<0.55)shootAndFinish(g,side,r,'putback',null,depth+1);
  else{const s=bestBy(O,x=>x.p3*100,null);r.b.ast+=0;say(g,`Kicks it back out to ${lastName(s.name)}.`,'','pass');shootAndFinish(g,side,s,'reset',r,depth+1);}
}
function fastBreak(g,side){
  const O=g.teams[side],D=g.teams[1-side];
  const runner=bestBy(O,x=>x.athl+x.rim*0.3,null);
  setMU(g,runner,D.on[Math.max(0,slotOf(O,runner))]);
  say(g,`Fast break! ${lastName(runner.name)} is out in front!`,side===0?'cold':'hot','fast');
  g.clock=Math.max(0,g.clock-(4+rnd()*3));
  runner.b.fga++;
  const pm=clamp(runner.pr+0.1+(O.trait==='pace'?0.03:0)+(side===1?DIFF[g.diff].ai:0),0.5,0.92);
  if(rnd()<0.14){say(g,'Fouled from behind! Two shots.','sys','foul');const m=freeThrows(g,side,runner,2);say(g,m===2?'Knocks down both.':m?'Makes one of two.':'Misses both.','','ft');return;}
  if(rnd()<pm){runner.b.fgm++;runner.b.pts+=2;scoreAdd(g,side,2);runner.heat=Math.min(4,runner.heat+1);say(g,runner.dunks>25?'Throws it down in transition!':'Lays it in!',side===0?'cold':'hot','dunk');}
  else{say(g,'Blows the layup!','hot','miss');rebound(g,side,runner,1);}
}

/* ---------- Substitutions and stamina ---------- */
function autoSub(g,side,quiet){
  const T=g.teams[side];if(side===0&&!g.autoSubs)return;
  for(let i=0;i<5;i++){
    const p=T.on[i];
    // bring a rested starter back
    if(p.home!==i){const st=T.bench.find(b=>b.home===i);if(st&&st.st>=86&&(p.st<80||g.q>=4&&g.clock<150)){doSub(g,side,i,T.bench.indexOf(st),quiet);continue;}}
    if(p.st<55){
      const cands=T.bench.map((b,j)=>({b,j})).filter(x=>x.b.st>=78&&posDist(x.b.pos,POS[i])<=2);
      if(!cands.length)continue;
      const c=cands.sort((a,b)=>(posDist(a.b.pos,POS[i])-posDist(b.b.pos,POS[i]))||(b.b.ovr-a.b.ovr))[0];
      doSub(g,side,i,c.j,quiet);
    }
  }
}
function doSub(g,side,i,j,quiet){
  const T=g.teams[side];const out=T.on[i],inn=T.bench[j];
  T.on[i]=inn;T.bench[j]=out;inn.slot=POS[i];out.slot=out.orig;
  if(!quiet&&side===0)g.subNote=(g.subNote||[]).concat(`${lastName(inn.name)} in for ${lastName(out.name)}`);
}

/* ---------- Coaches ---------- */
function aiPickScheme(g,side,initial){
  const opp=1-side,seen=g.seen.off[opp];const D=g.teams[side];const O=g.teams[opp];
  // what the other team likes to run: what it has called, plus what its players are built for
  const w={};TAGS.forEach(t=>w[t]=(seen[t]||0)*1.2);
  for(const p of O.on){const u=p.usg/20;for(const k of movesFor(p))w[MOVES[k].tag]+=u*0.6;}
  const sm=DIFF[g.diff].smart;
  const score=d=>{let s=0;for(const t of TAGS)s-=w[t]*MATRIX[t][d];
    if(d==='press')s-=4+(D.trait==='pressure'?-3:0)+(g.q>=4&&g.score[side]<g.score[opp]-6?-6:0);
    if(d==='trap')s+=D.trait==='pressure'?2:0;
    if(d==='zone')s-=O.on.reduce((a,p)=>a+(p.three-50),0)*0.04;
    if(d==='drop')s+=protector(D).rimD>80?2:0;
    if(d==='switch')s-=D.on.reduce((a,p)=>a+posDist(p.pos,'SF'),0)*0.4;
    return s+(rnd()-0.5)*(1-sm)*10;};
  return DEF_KEYS.slice().sort((a,b)=>score(b)-score(a))[0];
}
function aiCall(g,side,smart){
  const T=g.teams[side];const sm=smart==null?DIFF[g.diff].smart:smart;
  const lead=g.score[side]-g.score[1-side];const late=g.q>=4&&g.clock<40;
  const opts=[];
  for(const p of T.on)for(const k of movesFor(p)){
    const e=callEV(g,side,p,k);
    let v=e.ev;
    if(late&&lead<0&&lead>=-3&&e.z!=='three')v-=0.5;
    if(late&&lead<=-4&&e.z==='three')v+=0.15;
    const usage=Math.pow(p.usg/20,1.6)*(p.st<50?0.5:1);
    opts.push({p,k,v,usage});
  }
  const temp=2+sm*9;
  const c=wpick(opts,o=>o.usage*Math.exp((o.v-1)*temp));
  return{p:c.p,key:c.k};
}

/* ---------- Flow ---------- */
// Plays the user's call, then everything automatic (opponent trips, fast breaks, quarter breaks)
// until the user owns the ball again or the game ends.
function userCall(g,pi,key){
  g.lines=[];g.subNote=null;
  const p=g.teams[0].on[pi];
  g.lastCall={pi,key,name:p.name};
  runPossession(g,0,{p,key});
  endPossession(g,0);
  runUntilUser(g);
}
function endPossession(g,side){
  drain(g);g.poss_n++;
  if(g.clock<=0){endPeriod(g);return;}
  g.poss=1-side;
  autoSub(g,0,false);autoSub(g,1,true);
  if(g.subNote){say(g,`Sub: ${g.subNote.join(', ')}.`,'sys','sub');g.subNote=null;}
}
function endPeriod(g){
  g.fast=null;
  const sc=`${g.teams[0].abbr} ${g.score[0]}, ${g.teams[1].abbr} ${g.score[1]}`;
  if(g.q>=4&&g.score[0]!==g.score[1]){g.over=true;g.clock=0;say(g,`That's the final buzzer! ${sc}.`,'sys','final');return;}
  if(g.q>=4){g.ot++;g.q++;g.clock=Math.max(60,Math.round(g.qsec/2));g.poss=rnd()<0.5?0:1;
    say(g,`Tied at the end of ${g.ot>1?'overtime':'regulation'}! Overtime: ${fmtClock(g.clock)} on the clock.`,'sys','ot');}
  else{
    const q=g.q;g.q++;g.clock=g.qsec;
    g.poss=g.q===4?g.tip:1-g.tip;
    say(g,q===2?`Halftime. ${sc}.`:`End of the ${ord(q)}. ${sc}.`,'sys','period');
  }
  for(const T of g.teams)for(const p of T.players)p.st=clamp(p.st+(g.q===3?45:22),0,100);
  autoSub(g,0,true);autoSub(g,1,true);
  // opponent coach rethinks at every break
  const ns=aiPickScheme(g,1,false);
  if(ns!==g.scheme[1]){g.scheme[1]=ns;say(g,`${g.teams[1].abbr} switch to ${DEFS[ns].name}.`,'hot','switch');}
}
function runUntilUser(g){
  let guard=0;
  while(!g.over&&guard++<40){
    if(g.fast!=null){const s=g.fast;g.fast=null;g.poss=s;fastBreak(g,s);endPossession(g,s);continue;}
    if(g.poss===0)break;
    aiAdjust(g);
    const c=aiCall(g,1);
    runPossession(g,1,c);
    endPossession(g,1);
  }
  if(!g.over)setMU(g,g.teams[0].on[0],g.teams[1].on[0]);
  g.log.push({q:g.q,ot:g.ot,lines:g.lines.map(l=>l.t)});
  if(g.log.length>200)g.log.shift();
}
// Opponent timeouts and scheme switches when the user gets hot
function aiAdjust(g){
  if(g.switchCooldown>0)g.switchCooldown--;
  if(g.runs[0]>=8&&g.timeouts[1]>0&&g.switchCooldown===0){
    g.timeouts[1]--;g.runs[0]=0;g.switchCooldown=6;
    for(const p of g.teams[1].on)p.st=clamp(p.st+10,0,100);
    say(g,`${g.teams[1].abbr} call timeout to stop the run.`,'sys','timeout');
    const ns=aiPickScheme(g,1,false);if(ns!==g.scheme[1]){g.scheme[1]=ns;say(g,`They come out in ${DEFS[ns].name}.`,'hot','switch');}
    return;
  }
  const lastTag=g.lastCall&&MOVES[g.lastCall.key].tag;
  if(lastTag&&g.switchCooldown===0&&(g.seen.off[0][lastTag]||0)>=DIFF[g.diff].adapt&&MATRIX[lastTag][g.scheme[1]]>=1){
    const ns=aiPickScheme(g,1,false);if(ns!==g.scheme[1]){g.scheme[1]=ns;g.switchCooldown=5;say(g,`${g.teams[1].abbr} adjust to your ${TAG_LABEL[lastTag].toLowerCase()} and switch to ${DEFS[ns].name}.`,'hot','switch');}
  }
}
function userScheme(g,k){g.scheme[0]=k;}
function userTimeout(g){
  if(g.timeouts[0]<=0||g.over)return false;
  g.lines=[];g.timeouts[0]--;g.drawn[0]=1;g.runs[1]=0;
  for(const p of g.teams[0].on)p.st=clamp(p.st+12,0,100);
  for(const p of g.teams[0].bench)p.st=clamp(p.st+6,0,100);
  say(g,`${g.teams[0].abbr} call timeout. Legs get a breather and the next play is drawn up (+1 step).`,'sys','timeout');
  return true;
}
function userSub(g,i,j){doSub(g,0,i,j,true);}
// Coach calls for the user: auto mode and sim
function coachCall(g){const c=aiCall(g,0,0.75);return{pi:g.teams[0].on.indexOf(c.p),key:c.key};}
function simToEnd(g){let n=0;while(!g.over&&n++<400){const c=coachCall(g);userCall(g,c.pi,c.key);}}

/* ---------- After the game ---------- */
function gameScore(p){const b=p.b;return b.pts+0.4*b.fgm-0.7*b.fga-0.4*(b.fta-b.ftm)+0.7*b.orb+0.3*b.drb+b.stl+0.7*b.ast+0.7*b.blk-b.tov;}
function finishGame(S){
  const g=S.game;const win=g.score[0]>g.score[1];
  const U=g.teams[0];const mvp=U.players.slice().sort((a,b)=>gameScore(b)-gameScore(a))[0];
  const line=p=>{const b=p.b;return `${b.pts} pts, ${b.orb+b.drb} reb, ${b.ast} ast`;};
  const box=side=>g.teams[side].players.map(p=>({name:p.name,slot:p.slot,home:p.home,...p.b}));
  const capGain=win?4:1;
  const r={week:S.week,round:g.round,label:g.label,opp:g.opp,win,us:g.score[0],them:g.score[1],ot:g.ot,abbrs:[U.abbr,g.teams[1].abbr],
    mvp:{name:mvp.name,line:line(mvp)},box:[box(0),box(1)],capGain};
  S.results.push(r);S.last=r;S.cap+=capGain;
  if(g.round==='reg'){S.week++;
    if(S.week>=10){const W=S.results.filter(x=>x.round==='reg'&&x.win).length;S.stage=W>=PLAYOFF_WINS?'semi':W>=PLAYIN_WINS?'playin':null;if(!S.stage){S.done=true;S.outcome='missed';}}}
  else{
    const order=['playin','semi','conf','final'];
    if(!win){S.done=true;S.outcome=g.round;}
    else if(g.round==='final'){S.done=true;S.outcome='champion';}
    else S.stage=order[order.indexOf(g.round)+1];
  }
  S.game=null;
}
/* ---------- Saving ----------
   Game players share objects between players/on/bench and inherit ratings from the data table,
   so saves store lineup indexes and rebuild the links on load. */
function packReplacer(k,v){
  if((k==='on'||k==='bench')&&Array.isArray(v)&&this&&Array.isArray(this.players))return v.map(p=>this.players.indexOf(p));
  if(k==='mu'||k==='lines'||k==='_moves')return undefined;
  return v;
}
function unpackSeason(S){
  if(!S||!S.game)return S;
  const g=S.game;
  for(const T of g.teams){
    for(const p of T.players){const base=PBYN[p.name];if(base)Object.setPrototypeOf(p,base);}
    T.on=T.on.map(i=>T.players[i]);T.bench=T.bench.map(i=>T.players[i]);
  }
  g.lines=[];g.mu=null;if(g.log&&g.log.length>80)g.log=g.log.slice(-80);
  return S;
}

/* ---------- Sprites: original pixel basketball players, drawn in code and cached by look ---------- */
const SPR_W=40,SPR_H=48,SPR_CACHE={};
const BUILDS={PG:{sh:9,to:6,leg:4},SG:{sh:10,to:6,leg:4},SF:{sh:10,to:7,leg:5},PF:{sh:11,to:8,leg:5},C:{sh:12,to:9,leg:6}};
function spriteURL(o){
  const key=[o.c1,o.c2,o.pos,o.view,o.ball?1:0,o.def?1:0].join('|');
  if(SPR_CACHE[key]!==undefined)return SPR_CACHE[key];
  const W=SPR_W,H=SPR_H,buf=new Array(W*H).fill(null);
  const put=(x,y,c)=>{if(c&&x>=0&&x<W&&y>=0&&y<H)buf[y*W+x]=c;};
  const rect=(x0,y0,w,h,c)=>{for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)put(x,y,typeof c==='function'?c(x,y):c);};
  const ell=(cx,cy,rx,ry,c)=>{for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++){const dy=(y+.5-cy)/ry;if(dy<-1||dy>1)continue;const hw=rx*Math.sqrt(1-dy*dy);for(let x=Math.round(cx-hw);x<Math.round(cx+hw);x++)put(x,y,typeof c==='function'?c(x,y):c);}};
  const B=BUILDS[o.pos]||BUILDS.SF,cx=20,front=o.view==='front';

/* ---------- Custom sprites: optional images from a sprites/ folder next to this file ----------
   sprites/<name>.png       front view    sprites/back/<name>.png  back view (else the front is mirrored)
   <name> is the player's name in lowercase with dashes: "Jalen Brunson" -> jalen-brunson. */
const CUSTOM={on:true,hit:{},pend:{},tok:0};
const monSlug=n=>String(n).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/['’.]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const customPath=(name,view)=>(view==='back'?'sprites/back/':'sprites/')+monSlug(name)+'.png';
function probe(url){
  if(url in CUSTOM.hit)return Promise.resolve(CUSTOM.hit[url]);
  if(CUSTOM.pend[url])return CUSTOM.pend[url];
  return CUSTOM.pend[url]=new Promise(res=>{const im=new Image();const done=ok=>{CUSTOM.hit[url]=ok;delete CUSTOM.pend[url];res(ok);};im.onload=()=>done(im.naturalWidth>0);im.onerror=()=>done(false);im.src=url;});
}
function customNow(name,view){
  if(!CUSTOM.on||!name||location.protocol!=='file:'&&!/^(localhost|127\.)/.test(location.hostname))return null;
  const f=customPath(name,'front');
  if(view==='back'){const b=customPath(name,'back'),hb=CUSTOM.hit[b];if(hb===undefined)return undefined;if(hb)return{src:b,flip:false};}
  const hf=CUSTOM.hit[f];if(hf===undefined)return undefined;

async function customCheck(name,view){if(view==='back'&&await probe(customPath(name,'back')))return;await probe(customPath(name,'front'));}
function setSpr(img,name,view,proc){
  if(!img)return;img._proc=proc;
  const c=customNow(name,view),want=c?c.src:proc;
  if(img.getAttribute('src')!==want)img.src=want;
  img.classList.toggle('custom',!!c);img.classList.toggle('flip',!!(c&&c.flip));
  const t=img._sprTok=++CUSTOM.tok;

function upgradeSprites(root){if(!root||!root.querySelectorAll)return;root.querySelectorAll('img[data-mon]').forEach(img=>{if(img._sprTok)return;setSpr(img,img.dataset.mon,img.dataset.view||'front',img.getAttribute('src'));});}

/* ---------- Sound: short synthesized cues, started only after a tap ---------- */
const SND={ctx:null};
function actx(){if(!PREFS.sound)return null;try{if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;SND.ctx=new C();}if(SND.ctx.state==='suspended')SND.ctx.resume();return SND.ctx;}catch(e){return null;}}
function tone(f,d,type,vol,t0,slide){const c=actx();if(!c)return;const t=c.currentTime+(t0||0);const o=c.createOscillator(),gn=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);gn.gain.setValueAtTime(vol||.05,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn).connect(c.destination);o.start(t);o.stop(t+d+.03);}

  blip:()=>tone(1320,.04,'square',.025),

  back:()=>tone(620,.06,'square',.03),
  call:()=>{tone(520,.06,'square',.03);tone(780,.08,'square',.03,.06);},
  swish:()=>{noise(.18,.06,5200);tone(1046,.08,'triangle',.04,.05);},
  three:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.08,'square',.04,i*.06)),
  dunk:()=>{noise(.25,.13,900);tone(140,.22,'square',.05,0,60);},

const Bus={h:{},on(evs,fn){evs.split(' ').forEach(e=>(this.h[e]||(this.h[e]=[])).push(fn));},emit(e,p){const l=this.h[e];if(l)for(const fn of l)fn(p);}};
const DOM={};

function centerOf(el){if(!DOM.scene||!el)return null;const a=DOM.scene.getBoundingClientRect(),b=el.getBoundingClientRect();return{x:b.left-a.left+b.width/2,y:b.top-a.top+b.height*.45};}

function drawBg(g){

  const W=192,H=128;let seed=7;for(const ch of g.opp)seed=(seed*31+ch.charCodeAt(0))>>>0;
  const rnd2=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};

  const ellipse=(cx,cy,rx,ry,col)=>{c.fillStyle=col;for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++){const dy=(y+.5-cy)/ry;if(dy<-1||dy>1)continue;const hw=rx*Math.sqrt(1-dy*dy);const x0=Math.round(cx-hw),x1=Math.round(cx+hw);c.fillRect(x0,y,x1-x0,1);}};

  const T=TEAMS[g.opp],c1=T.c1,c2=T.c2;
  ['#0a1120','#0c1527','#0f1a2f','#132038','#172641'].forEach((col,i)=>px(0,i*5,W,5,col));
  for(const lx of [10,160]){px(lx-2,2,26,9,'rgba(255,240,200,0.08)');px(lx,3,22,6,'#2b3a5c');for(let i=0;i<5;i++)px(lx+1+i*4,4,3,4,'#fff2c8');}
  px(0,22,W,20,'#1a2340');
  const crowd=[c1,c1,c2,shade(c1,-.25),'#cfd6e6','#8d98b3','#46557a',S.color];
  for(let y=23;y<41;y+=2)for(let x=(y%4===3?0:1);x<W;x+=2)if(rnd2()<.82)px(x,y,1,1,crowd[Math.floor(rnd2()*crowd.length)]);
  px(0,41,W,5,c1);px(0,41,W,1,shade(c1,.3));px(0,45,W,1,shade(c1,-.4));

  let y=46,h=2;let k=0;while(y<H){px(0,y,W,1,k%2?'#bd7d40':'#d1945a');y+=h;h=Math.min(9,h+0.6);k++;}
  for(let r=0;r<16;r++){const yy=46+Math.round(Math.pow(r/16,1.4)*(H-46));const off=(r*37)%23;for(let x=off;x<W;x+=23+r)px(x,yy,1,Math.max(1,Math.round(r/4)),'rgba(90,45,10,.25)');}

}

/* ---------- Playback queue: replays a possession line by line ---------- */
const PB={active:false,skip:false,token:0,typing:false,finish:false,res:null};
const SPEED={slow:{c:30,p:1000},mid:{c:16,p:620},fast:{c:6,p:300}};
function pbTap(){if(!PB.active)return;if(PB.typing){PB.finish=true;return;}if(PB.res){const r=PB.res;PB.res=null;r();}}
function waitTap(ms){return new Promise(res=>{let done=false;const fin=()=>{if(done)return;done=true;PB.res=null;if(DOM.adv)DOM.adv.classList.remove('on');res();};PB.res=fin;if(DOM.adv)DOM.adv.classList.add('on');if(ms!=null)setTimeout(fin,ms);});}
function typeLine(L,tok){
  const el=DOM.dlgText;if(!el)return Promise.resolve();
  el.className='dlg-text '+(L.c||'');if(DOM.dlgSR)DOM.dlgSR.textContent=L.t;
  if(PB.skip){el.textContent=L.t;return Promise.resolve();}
  const sp=SPEED[PREFS.speed]||SPEED.mid,txt=L.t,t0=performance.now();
  PB.typing=true;PB.finish=false;
  return new Promise(res=>{const step=()=>{if(tok!==PB.token){PB.typing=false;res();return;}const n=PB.finish||PB.skip?txt.length:Math.min(txt.length,Math.floor((performance.now()-t0)/sp.c)+1);el.textContent=txt.slice(0,n);if(n>=txt.length){PB.typing=false;res();return;}requestAnimationFrame(step);};step();});
}
const SWAPPY=new Set(['call','fast','oreb','steal','block']);
async function applyState(s,tok){
  const prev=UI.V;UI.V=s;
  const changed=prev&&((prev.u&&s.u&&prev.u.name!==s.u.name)||(prev.o&&s.o&&prev.o.name!==s.o.name)||prev.ball!==s.ball);
  if(changed&&!PB.skip&&!REDUCED&&DOM.sprU){
    const cu=!prev.u||!s.u||prev.u.name!==s.u.name||prev.ball!==s.ball,co=!prev.o||!s.o||prev.o.name!==s.o.name||prev.ball!==s.ball;
    if(cu)DOM.sprU.classList.add('away');if(co)DOM.sprO.classList.add('away');
    await sleep(190);if(tok!==PB.token)return;
    refreshSprites();refreshBoxes(true);
    void DOM.sprU.offsetWidth;DOM.sprU.classList.remove('away');DOM.sprO.classList.remove('away');
    await sleep(200);
  }else{refreshSprites();refreshBoxes();}
  updateBug(s);
}
async function playLines(lines){
  const tok=++PB.token;PB.active=true;PB.skip=false;PB.finish=false;
  renderPanel();
  for(let i=0;i<lines.length;i++){
    if(tok!==PB.token)return;if(PB.skip)break;
    const L=lines[i];
    if(L.s){await applyState(L.s,tok);if(tok!==PB.token)return;}
    if(L.ev&&!PB.skip)Bus.emit(L.ev,{off:UI.V.poss,def:1-UI.V.poss});
    await typeLine(L,tok);
    if(tok!==PB.token)return;if(PB.skip)break;
    const sp=SPEED[PREFS.speed]||SPEED.mid;
    await waitTap(PREFS.mode==='auto'?sp.p+Math.min(700,L.t.length*9):null);
  }
  if(tok!==PB.token)return;
  if(PB.skip&&lines.length&&DOM.dlgText){const L=lines[lines.length-1];DOM.dlgText.className='dlg-text '+(L.c||'');DOM.dlgText.textContent=L.t;}
  await applyState(snap(S.game),tok);
  if(tok!==PB.token)return;
  PB.active=false;PB.skip=false;
  afterPlayback();
}
function cancelPlayback(){PB.token++;PB.active=false;PB.skip=false;PB.typing=false;if(PB.res){const r=PB.res;PB.res=null;r();}}
function doUserAction(fn){
  const g=S.game;if(!g||PB.active)return;UI.confirmSim=false;
  fn();save();
  UI.menu='cmd';UI.sel=null;
  playLines(g.lines||[]);
}
let autoTimer=null;

function panelState(g){if(PB.active)return 'playing';if(g.over)return 'over';if(UI.auto)return 'auto';return 'offense';}

// While browsing plays, show the chosen player and his defender in the scene

  const g=S.game;if(g.over)return;

  const V=Object.assign({},UI.V,{u:{name:p.name,slot:p.slot,st:Math.round(p.st),pts:p.b.pts,heat:p.heat,pos:p.pos,ovr:p.ovr},o:{name:d.name,slot:d.slot,st:Math.round(d.st),pts:d.b.pts,heat:d.heat,pos:d.pos,ovr:d.ovr},ball:0,poss:0});

function sitStr(g){const d=g.score[0]-g.score[1];const tag=d>0?`Up ${d}`:d<0?`Down ${-d}`:'Tied';return `${g.ot?'Overtime':ord(g.q)+' quarter'}, ${fmtClock(g.clock)} · ${tag}`;}
const backBtn=()=>`<button class="mini-b bbtn" data-a="menu" data-v="cmd"><span class="key">B</span>Back</button>`;
const useBtn=(name,a,off)=>`<button class="abtn" data-a="${a}" ${name?'':'disabled'}><span class="key">A</span>${name?esc(name):esc(off||'Pick a play')}</button>`;
const ZONE_COLOR={rim:'#e2742b',short:'#d9a03a',mid:'#3f9cf5',three:'#7b4bc4'};

  else{const sym=v=>v>=2?'▲▲':v===1?'▲':v===0?'·':v===-1?'▼':'▼▼',cls=v=>v>=2?'p2':v===1?'p1':v===0?'z':v===-1?'m1':'m2';

/* ---------- Commands ---------- */
function resetGameUI(){UI.V=null;UI.menu='cmd';UI.ptab=0;UI.sel=null;UI.dsel=null;UI.lu=null;UI.sheet=false;UI.auto=false;UI.confirmSim=false;clearTimeout(autoTimer);}
const A={
  continue(){S=loadSaved();UI.screen=null;UI.editing=false;resetGameUI();render();},
  slot(d){UI.slot=d.p;render();},
  sign(d){
    const n=d.n;const from=SLOTS.find(s=>S.roster[s]===n);
    if(from){if(from===UI.slot)return;const tmp=S.roster[UI.slot];S.roster[UI.slot]=n;S.roster[from]=tmp;save();render();return;}
    const occ=S.roster[UI.slot];const avl=S.cap-capUsed(S)+(occ?cost(occ):0);if(cost(n)>avl)return;
    S.roster[UI.slot]=n;const nxt=SLOTS.find(s=>!S.roster[s]);if(nxt)UI.slot=nxt;save();render();
  },
  release(){S.roster[UI.slot]=null;save();render();},
  autofill(){autoFill(S);save();render();},
  clearRoster(){SLOTS.forEach(s=>S.roster[s]=null);UI.slot='PG';save();render();},
  draftDone(){if(!rosterFull(S)||capUsed(S)>S.cap)return;UI.editing=false;if(S.phase==='draft')S.phase='hub';save();render();window.scrollTo(0,0);},
  draftBack(){if(!rosterFull(S)||capUsed(S)>S.cap)autoFill(S);UI.editing=false;save();render();},
  editRoster(){UI.editing=true;UI.slot='PG';render();window.scrollTo(0,0);},
  tipoff(){
    const fresh=!S.game;if(fresh)S.game=newGame(S);
    S.phase='game';resetGameUI();save();
    const g=S.game,L=g.lines;
    UI.V=fresh&&L.length&&L[0].s?L[0].s:snap(g);
    if(fresh){UI.intro=true;PB.active=true;}
    render();UI.intro=false;window.scrollTo(0,0);
    if(fresh){const tok=PB.token;(async()=>{await sleep(80);DOM.sprO&&DOM.sprO.classList.remove('away');await sleep(240);DOM.sprU&&DOM.sprU.classList.remove('away');await sleep(260);if(tok===PB.token&&S&&S.phase==='game'&&S.game===g)playLines(L);})();}
  },
  resetSeason(){if(!UI.confirmReset){UI.confirmReset=true;render();return;}UI.confirmReset=false;clearSaved();S=null;UI.screen='title';render();window.scrollTo(0,0);},
  menu(d){if(PB.active)return;goMenu(d.v);if(d.v==='play'){const g=S.game;const lc=g.lastCall;if(lc&&g.teams[0].on[lc.pi]&&g.teams[0].on[lc.pi].name===lc.name){UI.ptab=lc.pi;UI.sel=lc.key;}}if(d.v==='def')UI.dsel=null;sfx(d.v==='cmd'?'back':'select');renderPanel();},
  ptab(d){UI.ptab=+d.v;UI.sel=null;sfx('blip');renderPanel();},
  sel(d){if(PB.active)return;if(UI.sel===d.k){A.use();return;}UI.sel=d.k;sfx('blip');renderPanel();},
  use(){const g=S.game,k=UI.sel;if(PB.active||!k||g.over)return;sfx('select');const pi=clamp(UI.ptab,0,4);doUserAction(()=>userCall(g,pi,k));},
  dsel(d){if(PB.active)return;if(UI.dsel===d.k&&d.k!==S.game.scheme[0]){A.dset();return;}UI.dsel=d.k;sfx('blip');renderPanel();},
  dset(){const g=S.game;if(!UI.dsel)return;userScheme(g,UI.dsel);sfx('select');UI.menu='cmd';save();updateBug(snap(g));renderPanel();},
  lu(d){
    const g=S.game,b=d.b==='1',i=+d.i;
    if(!UI.lu||UI.lu.b===b){UI.lu={b,i};sfx('blip');renderPanel();return;}
    const on=b?UI.lu.i:i,bn=b?i:UI.lu.i;userSub(g,on,bn);UI.lu=null;sfx('select');save();renderPanel();
  },
  autosubs(d){S.game.autoSubs=d.v==='1';sfx('blip');save();renderPanel();},
  coach(){const g=S.game;if(PB.active)return;UI.auto=true;UI.autoQ=g.q;UI.menu='cmd';renderPanel();scheduleAuto(150);},
  stopAuto(){UI.auto=false;clearTimeout(autoTimer);if(!PB.active)renderPanel();else{const b=DOM.panel&&DOM.panel.querySelector('[data-a="stopAuto"]');if(b)b.remove();}},
  stats(){UI.sheet=true;UI.sheetTab='box';sfx('select');renderSheet();},
  stab(d){UI.sheetTab=d.v;sfx('blip');renderSheet();},
  closeSheet(){UI.sheet=false;renderSheet();},
  timeout(){const g=S.game;if(PB.active)return;if(userTimeout(g)){UI.menu='cmd';save();playLines(g.lines);}},
  pref(d){PREFS[d.k]=d.v;savePrefs();sfx('blip');renderPanel();},
  sound(){PREFS.sound=!PREFS.sound;savePrefs();const b=document.getElementById('sndBtn');if(b){b.setAttribute('aria-pressed',String(PREFS.sound));b.textContent=PREFS.sound?'♪ On':'♪ Off';}if(PREFS.sound)sfx('select');},
  simRest(){if(!UI.confirmSim){UI.confirmSim=true;renderPanel();return;}const g=S.game;cancelPlayback();resetGameUI();simToEnd(g);save();UI.V=snap(g);render();},
  skip(){if(PB.active){PB.skip=true;PB.finish=true;pbTap();}},
  tap(){pbTap();},
  toPost(){cancelPlayback();const win=S.game.score[0]>S.game.score[1];finishGame(S);S.phase='post';resetGameUI();save();render();window.scrollTo(0,0);if(win)sfx('win');},
  exitHub(){cancelPlayback();resetGameUI();S.phase='hub';save();render();window.scrollTo(0,0);},
  postNext(){S.phase=S.done?'end':'hub';save();render();window.scrollTo(0,0);},
  newFromEnd(){clearSaved();S=null;UI.screen='title';render();window.scrollTo(0,0);}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  if(el.classList.contains('sheet-wrap')&&e.target.closest('[data-stop]'))return;
  const fn=A[el.dataset.a];if(fn){e.preventDefault();fn(el.dataset,el);}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='dq'){UI.q=t.value;const pos=t.selectionStart;render();const n=document.getElementById('dq');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}}
  if(t.id==='tName')UI.setup.name=t.value;
  if(t.id==='tAbbr')UI.setup.abbr=t.value.toUpperCase();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dteam'){UI.tf=t.value;render();}
  if(t.id==='dpos'){UI.pf=t.value;render();}
  if(t.id==='dsort'){UI.sort=t.value;render();}
  if(t.name==='tMode'){UI.setup.mode=t.value;render();}
  if(t.id==='tTeam'){UI.setup.team=t.value;const h=document.getElementById('heroSpr');const T=TEAMS[t.value];const u=spriteURL({c1:T.c1,c2:T.c2,pos:'SG',view:'front',ball:true});if(h&&u)h.src=u;}
  if(t.name==='tColor'){UI.setup.color=t.value;const h=document.getElementById('heroSpr');const u=spriteURL({c1:t.value,c2:trimFor(t.value),pos:'SG',view:'front',ball:true});if(h&&u)h.src=u;}
  if(t.name==='tDiff')UI.setup.difficulty=t.value;
  if(t.name==='tQ')UI.setup.qlen=+t.value;
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='setupForm')return;e.preventDefault();
  const su=UI.setup;
  if(su.mode==='team'){S=newSeason({mode:'team',realTeam:su.team,difficulty:su.difficulty,qlen:su.qlen});}
  else{
    const name=(su.name||'').trim()||'My Team';
    let abbr=(su.abbr||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3);if(abbr.length<2)abbr=name.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'YOU';
    S=newSeason({name,abbr,color:su.color,difficulty:su.difficulty,qlen:su.qlen});autoFill(S);
  }
  UI.screen=null;UI.editing=false;UI.slot='PG';UI.q='';UI.tf='';UI.pf='';save();render();window.scrollTo(0,0);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(UI.sheet){UI.sheet=false;renderSheet();return;}if(S&&S.phase==='game'&&!PB.active&&UI.menu!=='cmd'){goMenu('cmd');renderPanel();}return;}
  if(PB.active&&(e.key==='Enter'||e.key===' '||e.key==='z'||e.key==='a')&&!/^(BUTTON|INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)){e.preventDefault();pbTap();}
});

function start(data){
  if(data&&data.S){S=data.S;if(data.UI)Object.assign(UI,data.UI);}
  else{const sv=loadSaved();if(sv)S=sv;}
  resetGameUI();
  if(!S)UI.screen='title';
  render();
}
window.claude?.hot?.snapshot?.(()=>({S,UI:{slot:UI.slot,screen:UI.screen,editing:UI.editing,setup:UI.setup,q:UI.q,tf:UI.tf,pf:UI.pf,sort:UI.sort}}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});

</script>

</body></html>
